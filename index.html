<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmMaster — NHA CCMA Pharmacology Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f7f8fc;--surf:#fff;--glass:rgba(255,255,255,.75);--tx:#1a1a2e;--tx2:#555;--tx3:#999;--pri:#2563eb;--pri2:#1d4ed8;--pril:#dbeafe;--grn:#10b981;--grnl:#d1fae5;--red:#ef4444;--redl:#fee2e2;--org:#f59e0b;--orgl:#fef3c7;--pur:#8b5cf6;--purl:#ede9fe;--tea:#14b8a6;--teal:#ccfbf1;--pnk:#ec4899;--pnkl:#fce7f3;--sh:0 4px 24px rgba(0,0,0,.06);--sh2:0 8px 40px rgba(0,0,0,.1);--r:16px;--rs:10px;--f:'DM Sans',sans-serif;--fd:'Outfit',sans-serif;--fm:'Space Mono',monospace}
html{scroll-behavior:smooth}body{font-family:var(--f);background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}button{font-family:inherit;cursor:pointer;border:none;outline:none}input,select{font-family:inherit}
.tn{position:fixed;top:0;left:0;right:0;height:58px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.06);z-index:100;display:flex;align-items:center;padding:0 16px;gap:10px}
.logo{font-family:var(--fd);font-weight:800;font-size:20px;background:linear-gradient(135deg,var(--pri),var(--pur));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}.logo span{font-weight:400;font-size:12px;-webkit-text-fill-color:var(--tx3);margin-left:4px}
.ns{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;font-weight:700;color:var(--tx2);white-space:nowrap}.ns .sv{color:var(--pri);font-family:var(--fm);font-size:14px}.ns .sk{color:var(--org)}
.tb{position:fixed;top:58px;left:0;right:0;background:var(--surf);border-bottom:1px solid rgba(0,0,0,.06);z-index:99;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tb::-webkit-scrollbar{display:none}.tbi{display:inline-flex;gap:2px;padding:5px 10px}
.tbtn{padding:7px 11px;border-radius:8px;font-size:11px;font-weight:600;color:var(--tx3);background:none;transition:all .2s;flex-shrink:0}.tbtn:hover{background:var(--pril);color:var(--pri)}.tbtn.on{background:var(--pri);color:#fff}
.mn{margin-top:108px;padding:16px;max-width:1100px;margin-left:auto;margin-right:auto}
.mod{display:none;animation:fu .35s ease}.mod.on{display:block}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 5px rgba(37,99,235,.15)}50%{box-shadow:0 0 18px rgba(37,99,235,.35)}}
.cd{background:var(--surf);border-radius:var(--r);padding:22px;box-shadow:var(--sh);margin-bottom:14px;border:1px solid rgba(0,0,0,.04);animation:pop .3s ease}
.cd h3{font-family:var(--fd);font-weight:700;font-size:18px;margin-bottom:5px;line-height:1.3}.cd .sub{color:var(--tx2);font-size:13px;margin-bottom:12px;line-height:1.5}
.bg{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}.bg-g{background:var(--grnl);color:var(--grn)}.bg-r{background:var(--redl);color:var(--red)}.bg-b{background:var(--pril);color:var(--pri)}.bg-p{background:var(--purl);color:var(--pur)}.bg-o{background:var(--orgl);color:var(--org)}
.pw{width:100%;height:7px;background:#e5e7eb;border-radius:8px;overflow:hidden;margin:8px 0}.pf{height:100%;background:linear-gradient(90deg,var(--pri),var(--pur));border-radius:8px;transition:width .5s ease}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:var(--rs);font-weight:600;font-size:13px;transition:all .2s}.bp{background:var(--pri);color:#fff}.bp:hover{background:var(--pri2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(37,99,235,.3)}.bo{background:none;border:2px solid var(--pri);color:var(--pri)}.bo:hover{background:var(--pril)}.bs{padding:7px 14px;font-size:12px;border-radius:8px}.bt:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opt{padding:12px 15px;border:2px solid #e5e7eb;border-radius:var(--rs);cursor:pointer;transition:all .2s;font-size:13px;line-height:1.5;text-align:left;background:var(--surf)}.opt:hover:not(.dn){border-color:var(--pri);background:var(--pril)}.opt.ok{border-color:var(--grn)!important;background:var(--grnl)!important;color:#065f46}.opt.no{border-color:var(--red)!important;background:var(--redl)!important;color:#991b1b}.opt.dn{cursor:default;opacity:.88}
.rat{margin-top:10px;padding:11px 14px;border-radius:var(--rs);font-size:12px;line-height:1.6;animation:fu .3s ease}.rg{background:var(--grnl);border-left:4px solid var(--grn)}.rr{background:var(--redl);border-left:4px solid var(--red)}
.fc{border-radius:var(--r);margin-bottom:16px;overflow:hidden;border:2px solid rgba(0,0,0,.06);transition:all .3s;animation:fu .4s ease}.fc:hover{box-shadow:var(--sh2)}
.fc-top{padding:20px;cursor:pointer;transition:background .3s;position:relative}.fc-top:hover{filter:brightness(.97)}
.fc-header{display:flex;align-items:center;gap:12px}.fc-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.fc-title{font-family:var(--fd);font-weight:700;font-size:16px}.fc-suffix{font-family:var(--fm);font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;display:inline-block;margin-top:3px}
.fc-expand{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--tx3);transition:transform .3s}.fc.open .fc-expand{transform:translateY(-50%) rotate(180deg)}
.fc-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 20px;background:rgba(0,0,0,.01)}.fc.open .fc-body{max-height:2000px;padding:16px 20px 20px}
.fc-section{margin-bottom:10px;font-size:13px;line-height:1.6;color:var(--tx2)}.fc-section strong{color:var(--tx)}
.fc-pills{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.fc-pill{padding:3px 10px;border-radius:16px;font-size:11px;font-weight:600}
.fc-warn{padding:8px 12px;background:var(--redl);border-radius:8px;font-size:12px;color:#991b1b;margin-top:6px}
.cc-box{margin-top:14px;padding:14px;border:2px dashed rgba(37,99,235,.2);border-radius:var(--rs);background:rgba(37,99,235,.03);animation:glow 2s ease infinite}
.cc-box.answered{animation:none;border-style:solid}.cc-box.answered.cc-ok-box{border-color:var(--grn);background:var(--grnl)}.cc-box.answered.cc-no-box{border-color:var(--red);background:var(--redl)}
.cc-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--pri);margin-bottom:6px}.cc-q{font-weight:600;font-size:13px;margin-bottom:8px;line-height:1.4}.cc-opts{display:flex;flex-direction:column;gap:5px}
.cc-opt{padding:8px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:12px;cursor:pointer;transition:all .2s;background:var(--surf);text-align:left}.cc-opt:hover:not(.cc-dn){border-color:var(--pri);background:var(--pril)}.cc-opt.cc-ok{border-color:var(--grn)!important;background:var(--grnl)!important}.cc-opt.cc-no{border-color:var(--red)!important;background:var(--redl)!important}.cc-opt.cc-dn{cursor:default}
.cc-fb{margin-top:8px;font-size:11px;line-height:1.5;padding:8px;border-radius:6px}
.soap{background:linear-gradient(135deg,#f0f9ff,#ede9fe);border-radius:var(--r);padding:18px;margin:12px 0;border:1px solid rgba(0,0,0,.06)}.soap h4{font-family:var(--fd);margin-bottom:6px;color:var(--pri2)}.soap p{font-size:13px;line-height:1.5;color:var(--tx2);margin-bottom:4px}
.bsc{font-family:var(--fd);font-size:52px;font-weight:900;background:linear-gradient(135deg,var(--pri),var(--pur));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:8px 0}
.wh{text-align:center;padding:44px 16px 28px}.wh h1{font-family:var(--fd);font-weight:900;font-size:clamp(26px,5vw,42px);line-height:1.1;margin-bottom:12px}.wh h1 .g{background:linear-gradient(135deg,var(--pri),var(--pur),var(--pnk));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.wh p{font-size:14px;color:var(--tx2);max-width:520px;margin:0 auto 20px;line-height:1.6}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px;margin-top:20px}.mc{background:var(--surf);border:1px solid rgba(0,0,0,.06);border-radius:var(--r);padding:16px;cursor:pointer;transition:all .25s;text-align:left}.mc:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--pri)}
.mh{display:flex;align-items:center;gap:12px;margin-bottom:18px}.mh .mhi{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}.mh h2{font-family:var(--fd);font-weight:800;font-size:20px;margin-bottom:2px}.mh p{font-size:12px;color:var(--tx2)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);padding:10px 20px;border-radius:var(--rs);font-weight:600;font-size:13px;z-index:200;transition:transform .3s ease;box-shadow:var(--sh2)}.toast.show{transform:translateX(-50%) translateY(0)}.ts{background:var(--grn);color:#fff}.te{background:var(--red);color:#fff}
.ptabs{display:flex;gap:5px;margin:12px 0;flex-wrap:wrap}.ptab{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;border:2px solid #e5e7eb;background:var(--surf);transition:all .2s}.ptab:hover{border-color:var(--pri);background:var(--pril)}.ptab.pon{background:var(--pri);color:#fff;border-color:var(--pri)}
.qc{font-size:12px;color:var(--tx3);font-weight:600;margin-bottom:6px}
@media(max-width:768px){.mn{padding:10px}.cd{padding:16px}.tbtn{padding:6px 8px;font-size:10px}}
</style>
</head>
<body>
<nav class="tn"><div class="logo">PharmMaster<span>NHA CCMA</span></div><div class="ns"><span>Score: <span class="sv" id="nS">0</span></span><span class="sk">🔥<span id="nK">0</span></span></div></nav>
<div class="tb"><div class="tbi">
<button class="tbtn on" data-t="home">🏠 Home</button><button class="tbtn" data-t="m1">💊 Drug Classes</button><button class="tbtn" data-t="m2">🔒 Schedules</button><button class="tbtn" data-t="m3">⚠️ Reactions</button><button class="tbtn" data-t="m4">🧮 Dosage</button><button class="tbtn" data-t="m5">💉 Med Forms</button><button class="tbtn" data-t="m6">👀 Look-Alike</button><button class="tbtn" data-t="m7">🛤️ Routes</button><button class="tbtn" data-t="m8">🔬 ADME</button><button class="tbtn" data-t="m9">✅ Rights</button><button class="tbtn" data-t="m10">🗄️ Storage</button><button class="tbtn" data-t="m11">📚 Drug Info</button><button class="tbtn" data-t="sim">🏥 Simulation</button><button class="tbtn" data-t="perf">📊 Stats</button>
</div></div>
<div class="toast" id="toast"></div>
<div class="mn"><div class="mod on" id="home"></div><div class="mod" id="m1"></div><div class="mod" id="m2"></div><div class="mod" id="m3"></div><div class="mod" id="m4"></div><div class="mod" id="m5"></div><div class="mod" id="m6"></div><div class="mod" id="m7"></div><div class="mod" id="m8"></div><div class="mod" id="m9"></div><div class="mod" id="m10"></div><div class="mod" id="m11"></div><div class="mod" id="sim"></div><div class="mod" id="perf"></div></div>

<script>
const S={sc:0,st:0,bst:0,at:{},co:{}};
const MN={m1:'Drug Classifications',m2:'Controlled Substances',m3:'Side Effects & Reactions',m4:'Dosage & Measurements',m5:'Medication Forms',m6:'Look-Alike Drugs',m7:'Routes of Administration',m8:'Pharmacokinetics',m9:'Rights of Administration',m10:'Storage & Disposal',m11:'Drug Info & FDA',sim:'Clinical Simulation'};
const MI={m1:'💊',m2:'🔒',m3:'⚠️',m4:'🧮',m5:'💉',m6:'👀',m7:'🛤️',m8:'🔬',m9:'✅',m10:'🗄️',m11:'📚',sim:'🏥'};
const AC=window.AudioContext||window.webkitAudioContext;let ax;
function ea(){if(!ax)ax=new AC()}
function sOk(){try{ea();const o=ax.createOscillator(),g=ax.createGain();o.connect(g);g.connect(ax.destination);o.type='sine';o.frequency.setValueAtTime(523,ax.currentTime);o.frequency.setValueAtTime(659,ax.currentTime+.1);o.frequency.setValueAtTime(784,ax.currentTime+.2);g.gain.setValueAtTime(.12,ax.currentTime);g.gain.exponentialRampToValueAtTime(.001,ax.currentTime+.4);o.start();o.stop(ax.currentTime+.4)}catch(e){}}
function sNo(){try{ea();const o=ax.createOscillator(),g=ax.createGain();o.connect(g);g.connect(ax.destination);o.type='square';o.frequency.setValueAtTime(200,ax.currentTime);o.frequency.setValueAtTime(150,ax.currentTime+.15);g.gain.setValueAtTime(.07,ax.currentTime);g.gain.exponentialRampToValueAtTime(.001,ax.currentTime+.3);o.start();o.stop(ax.currentTime+.3)}catch(e){}}
function sh(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}
function toast(m,t){const e=document.getElementById('toast');e.textContent=m;e.className='toast '+(t==='e'?'te':'ts')+' show';setTimeout(()=>e.classList.remove('show'),2e3)}
function uN(){document.getElementById('nS').textContent=S.sc;document.getElementById('nK').textContent=S.st}
function aP(p){S.sc+=p;uN()}
function tr(m,ok){if(!S.at[m])S.at[m]=0;if(!S.co[m])S.co[m]=0;S.at[m]++;if(ok){S.co[m]++;S.st++;if(S.st>S.bst)S.bst=S.st}else S.st=0;uN()}
function sw(id){document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('on',b.dataset.t===id));document.querySelectorAll('.mod').forEach(m=>m.classList.toggle('on',m.id===id));if(id==='home')rHome();else if(id==='perf')rPerf();else lM(id);window.scrollTo({top:0})}
document.querySelectorAll('.tbtn').forEach(b=>b.addEventListener('click',()=>sw(b.dataset.t)));

/*═══ MCQ ENGINE — ALWAYS SHUFFLES OPTIONS AT RUNTIME ═══*/
function quiz(el,qs,mid,done){
const ls=sh(qs);let i=0;
function go(){if(i>=ls.length){if(done)done(el);return}
const q=ls[i];
// RUNTIME SHUFFLE: randomize option order every time
const oi=sh(q.o.map((_,j)=>j));
const ci=oi.indexOf(q.c);// new position of correct answer
el.innerHTML=`<div class="qc">Question ${i+1} of ${ls.length}</div><div class="pw"><div class="pf" style="width:${i/ls.length*100}%"></div></div>
<div class="cd"><h3 style="font-size:15px;line-height:1.5">${q.q}</h3><div class="opts" id="_o"></div><div id="_r"></div>
<div style="margin-top:10px;display:none" id="_n"><button class="bt bp bs" id="_nb">${i<ls.length-1?'Next →':'Finish ✓'}</button></div></div>`;
const oe=document.getElementById('_o');
oi.forEach((orig,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=q.o[orig];
b.onclick=()=>{oe.querySelectorAll('.opt').forEach((x,k)=>{x.classList.add('dn');if(k===ci)x.classList.add('ok');if(k===j&&j!==ci)x.classList.add('no')});
const ok=j===ci;ok?(sOk(),aP(10),toast('✓ Correct! +10')):(sNo(),toast('✗ Incorrect','e'));tr(mid,ok);
document.getElementById('_r').innerHTML=`<div class="rat ${ok?'rg':'rr'}"><strong>${ok?'✓ Correct':'✗ Incorrect'}</strong><br>${q.r[q.c]}</div>`;
document.getElementById('_n').style.display='block'};oe.appendChild(b)});
document.getElementById('_nb').onclick=()=>{i++;go()}}go()}
function doneH(mid){return `<div class="cd" style="text-align:center;padding:32px"><h3>🎉 Section Complete!</h3><p class="sub">Great work!</p><button class="bt bp bs" onclick="sw('${mid}')">🔄 Retry</button> <button class="bt bo bs" onclick="sw('perf')">📊 Stats</button></div>`}
function hdr(ic,t,d,c){return `<div class="mh"><div class="mhi" style="background:${c}15;color:${c}">${ic}</div><div><h2>${t}</h2><p>${d}</p></div></div>`}

/*═══ FLASHCARD with CONCEPT CHECK — OPTIONS SHUFFLED AT RUNTIME ═══*/
let ccU=0;
function makeFC(o){
const uid='fc'+(ccU++),ccId='cc'+uid;
let body='';
(o.sections||[]).forEach(s=>body+=`<div class="fc-section">${s}</div>`);
if(o.pills&&o.pills.length)body+=`<div class="fc-pills">${o.pills.map(p=>`<span class="fc-pill" style="background:${o.iconBg||'var(--pril)'};color:${o.iconColor||'var(--pri)'}">${p}</span>`).join('')}</div>`;
if(o.warn)body+=`<div class="fc-warn">⚠️ ${o.warn}</div>`;
if(o.cc){
// Shuffle concept check options at BUILD TIME
const cc=o.cc,si=sh(cc.o.map((_,i)=>i)),sci=si.indexOf(cc.c);
body+=`<div class="cc-box" id="${ccId}"><div class="cc-label">🧠 Concept Check</div><div class="cc-q">${cc.q}</div><div class="cc-opts">`
+si.map((orig,i)=>`<button class="cc-opt" onclick="ccA(this,'${ccId}',${sci},'${cc.mid||'m1'}',\`${cc.r.replace(/`/g,"'").replace(/\\/g,"\\\\")}\`)">${cc.o[orig]}</button>`).join('')
+`</div><div id="${ccId}fb"></div></div>`}
return `<div class="fc" id="${uid}" style="background:${o.bg||'linear-gradient(135deg,#f0f9ff,#ede9fe)'}">
<div class="fc-top" onclick="document.getElementById('${uid}').classList.toggle('open')">
<div class="fc-header"><div class="fc-icon" style="background:${o.iconBg||'var(--pril)'};color:${o.iconColor||'var(--pri)'}">${o.icon||'💊'}</div>
<div><div class="fc-title">${o.title}</div>${o.subtitle?`<div class="fc-suffix" style="background:${o.iconBg||'var(--pril)'};color:${o.iconColor||'var(--pri)'}">${o.subtitle}</div>`:''}</div></div>
<div class="fc-expand">▼</div></div><div class="fc-body">${body}</div></div>`}
function ccA(btn,boxId,ci,mid,rat){
const box=document.getElementById(boxId);if(box.classList.contains('answered'))return;
const btns=box.querySelectorAll('.cc-opt'),idx=[...btns].indexOf(btn),ok=idx===ci;
btns.forEach((b,i)=>{b.classList.add('cc-dn');if(i===ci)b.classList.add('cc-ok');if(i===idx&&!ok)b.classList.add('cc-no')});
box.classList.add('answered',ok?'cc-ok-box':'cc-no-box');
ok?(sOk(),aP(5),toast('✓ Concept check passed! +5')):(sNo(),toast('✗ Review the answer','e'));
tr(mid,ok);document.getElementById(boxId+'fb').innerHTML=`<div class="cc-fb" style="background:${ok?'var(--grnl)':'var(--redl)'}"><strong>${ok?'✓':'✗'}</strong> ${rat}</div>`}

/*═══════════════════════════════════════════════════════
 ALL DATA — CORRECT POSITIONS DISTRIBUTED 0/1/2/3 EVENLY
 ALL OPTION LENGTHS BALANCED (no "longest = correct" pattern)
 RUNTIME SHUFFLE adds additional randomization on top
═══════════════════════════════════════════════════════*/
const D={
suffixes:[
{suf:'-pril',cls:'ACE Inhibitor',what:'Relaxes blood vessels by blocking ACE enzyme to lower BP',drugs:['Lisinopril','Enalapril','Benazepril','Ramipril'],side:'Persistent dry cough and hyperkalemia',avoid:'Pregnancy — causes fetal harm',color:'var(--pri)',bg:'var(--pril)',
cc:{q:'A drug ending in "-pril" is classified as which type?',o:['A beta-adrenergic receptor blocker','An angiotensin-converting enzyme inhibitor','A cholesterol-lowering HMG-CoA agent','An angiotensin II receptor antagonist'],c:1,r:'"-pril" = ACE Inhibitor. They block ACE enzyme to lower blood pressure.'}},
{suf:'-olol',cls:'Beta Blocker',what:'Slows heart rate and lowers BP by blocking beta receptors',drugs:['Metoprolol','Atenolol','Propranolol','Carvedilol'],side:'Fatigue, dizziness, and slow heart rate',avoid:'Asthma patients — causes bronchospasm',color:'var(--grn)',bg:'var(--grnl)',
cc:{q:'Why are "-olol" drugs dangerous for patients with asthma?',o:['They block lung beta-2 receptors causing bronchospasm','They raise blood sugar to dangerous levels','They cause severe allergic skin rashes','They increase the heart rate dangerously'],c:0,r:'Beta blockers block beta-2 receptors in lungs → bronchospasm in asthma.'}},
{suf:'-sartan',cls:'ARB',what:'Blocks angiotensin II receptors to lower blood pressure',drugs:['Losartan','Valsartan','Irbesartan'],side:'Dizziness and elevated potassium levels',avoid:'Pregnancy — similar risk as ACE inhibitors',color:'var(--tea)',bg:'var(--teal)',
cc:{q:'When is an ARB prescribed instead of an ACE inhibitor?',o:['When the patient has high cholesterol levels','When the patient needs stronger pain control','When an ACE inhibitor causes a persistent dry cough','When the patient requires diabetes management'],c:2,r:'ARBs are the alternative when ACE inhibitors cause dry cough.'}},
{suf:'-statin',cls:'Statin (Antilipemic)',what:'Lowers cholesterol by inhibiting liver enzyme HMG-CoA',drugs:['Atorvastatin','Simvastatin','Rosuvastatin','Pravastatin'],side:'Muscle pain (myalgia) and liver enzyme changes',avoid:'Liver disease and grapefruit juice interaction',color:'var(--org)',bg:'var(--orgl)',

// M1 QUIZ — correct positions: 0,3,2,0,1,2,3,0,1,3
m1q:[
{q:'A drug ending in "-pril" belongs to which drug class?',o:['ACE inhibitor for blood pressure','Beta blocker for heart rate control','Calcium channel blocker for vessels','Angiotensin receptor blocker type'],c:0,r:['Correct! "-pril" = ACE Inhibitor that lowers blood pressure.','"-olol" indicates a beta blocker.','-dipine indicates a CCB.','-sartan indicates an ARB.']},
{q:'Which suffix tells you a drug is a beta blocker?',o:['-statin for lipid management','-pril for blood pressure control','-sartan for vessel relaxation','-olol for heart rate reduction'],c:3,r:['-statin = cholesterol.','-pril = ACE inhibitor.','-sartan = ARB.','Correct! "-olol" = Beta Blocker (metoprolol, atenolol).']},
{q:'Metformin is the first-line drug for Type 2 diabetes. Its class is:',o:['A sulfonylurea that stimulates insulin','An insulin preparation for injection','A biguanide that reduces liver glucose','A thiazolidinedione for insulin sensitivity'],c:2,r:['Sulfonylureas are second-line agents.','Insulin is for Type 1 or advanced cases.','Correct! Metformin (biguanide) = first-line T2DM drug.','TZDs are add-on therapy only.']},
{q:'Warfarin is prescribed to patients primarily for:',o:['Preventing formation of blood clots','Lowering elevated cholesterol levels','Reducing joint pain and inflammation','Managing elevated blood sugar levels'],c:0,r:['Correct! Warfarin = anticoagulant preventing clots.','Statins lower cholesterol levels.','NSAIDs reduce inflammation and pain.','Antidiabetic drugs manage blood sugar.']},
{q:'The suffix "-prazole" indicates a drug that:',o:['Blocks beta receptors in the heart','Reduces stomach acid as a PPI drug','Lowers cholesterol in the bloodstream','Relaxes blood vessel smooth muscle'],c:1,r:['That is "-olol" for beta blockers.','Correct! "-prazole" = PPI for acid reduction.','That is "-statin" for cholesterol.','-dipine relaxes vessel walls.']},
{q:'Albuterol is used as a rescue inhaler. It is classified as:',o:['A corticosteroid for reducing inflammation','A beta blocker that slows the heart rate','A short-acting beta-agonist bronchodilator','An ACE inhibitor for blood pressure use'],c:2,r:['Prednisone is a corticosteroid.','Beta blockers are contraindicated in asthma.','Correct! Albuterol = SABA bronchodilator for asthma rescue.','ACE inhibitors lower blood pressure.']},
{q:'A drug ending in "-sartan" is prescribed for:',o:['Managing clinical depression symptoms','Lowering blood cholesterol levels','Controlling Type 2 diabetes glucose','Reducing elevated blood pressure'],c:3,r:['SSRIs treat depression.','-statin drugs lower cholesterol.','Metformin manages diabetes.','Correct! "-sartan" = ARB for blood pressure.']},
{q:'The suffix "-lam" (as in alprazolam) identifies:',o:['A benzodiazepine for anxiety and seizures','An ACE inhibitor for blood pressure control','A statin for cholesterol management only','An antibiotic for bacterial infections'],c:0,r:['Correct! "-lam" and "-pam" = benzodiazepine drugs.','-pril = ACE inhibitor.','-statin = cholesterol drug.','-cillin = antibiotic.']},
{q:'Prednisone is classified in which drug category?',o:['Non-steroidal anti-inflammatory drug','A corticosteroid for immune suppression','An opioid narcotic for severe pain','An antibiotic for bacterial infections'],c:1,r:['NSAIDs include ibuprofen and naproxen.','Correct! Prednisone = corticosteroid.','Opioids are narcotics like morphine.','Antibiotics fight bacterial infections.']},
{q:'Hydrochlorothiazide (HCTZ) works by acting as:',o:['A beta blocker that reduces heart rate','An ACE inhibitor blocking enzyme function','A calcium blocker relaxing vessel walls','A thiazide diuretic removing excess fluid'],c:3,r:['-olol drugs are beta blockers.','-pril drugs are ACE inhibitors.','-dipine drugs are CCBs.','Correct! HCTZ = thiazide diuretic for fluid/BP.']},
],

{q:'Hydrocodone is Schedule II. This means it requires:',o:['A brand new prescription for each fill','Up to five refills within six months','An over-the-counter purchase at any pharmacy','No DEA restrictions on dispensing at all'],c:0,r:['Correct! Schedule II = NO refills, new Rx every time.','That applies to Schedule III-V only.','Schedule II requires a prescription always.','Schedule II has strict DEA oversight.']},

// M3 — correct: 1,3,2,0,2,3
m3teach:[
{term:'Indication',def:'The approved reason or purpose for prescribing a drug',ex:'Metformin is INDICATED for Type 2 diabetes control',icon:'✅',color:'var(--grn)',
cc:{q:'The term "indication" refers to:',o:['A pre-existing reason to avoid a drug','A serious unexpected reaction to a drug','A secondary tolerable effect of a drug','The approved medical purpose for a drug'],c:3,r:'Indication = the condition for which a drug is approved.'}},
{term:'Contraindication',def:'A reason NOT to give a drug because it could cause harm',ex:'Pregnancy is a CONTRAINDICATION for "-pril" drugs',icon:'🚫',color:'var(--red)',
cc:{q:'ACE inhibitors ("-pril") are contraindicated in pregnancy because:',o:['They can cause fatal harm to the developing fetus','They produce a persistent dry cough in mothers','They lower blood sugar to dangerous levels','They are simply too expensive for most patients'],c:0,r:'ACE inhibitors can cause fetal renal damage and death. Absolute contraindication.'}},
{term:'Side Effect',def:'An expected and often tolerable secondary drug effect',ex:'Dry cough from lisinopril is a well-known SIDE EFFECT',icon:'💭',color:'var(--org)',
cc:{q:'Mild dizziness from metoprolol ("-olol") is classified as:',o:['A severe immune-mediated allergic response','A pre-existing reason to withhold the drug','A common and expected side effect of the drug','A serious adverse reaction requiring emergency care'],c:2,r:'Dizziness = common beta blocker side effect. Usually tolerable.'}},
{term:'Adverse Reaction',def:'A serious, harmful, or unexpected drug response',ex:'Anaphylaxis from penicillin is an ADVERSE REACTION',icon:'⚠️',color:'var(--red)',
cc:{q:'Hives, facial swelling, and breathing difficulty from penicillin is:',o:['A common tolerable side effect of the drug','A pre-existing contraindication to treatment','A normal therapeutic response to the drug','A severe adverse allergic reaction (anaphylaxis)'],c:3,r:'Anaphylaxis = life-threatening adverse/allergic reaction. Call 911.'}},
{term:'Drug Interaction',def:'When two or more drugs affect each other\'s action',ex:'Warfarin + aspirin = increased risk of bleeding',icon:'🔄',color:'var(--pur)',
cc:{q:'A patient on warfarin starts taking daily aspirin. The concern is:',o:['Both drugs lower blood sugar dangerously','They cancel each other out completely','Both thin the blood increasing bleeding risk','There is no clinically significant concern'],c:2,r:'Warfarin + aspirin = additive anticoagulant effect = bleeding risk.'}},
],
m3q:[

{q:'Patient has a documented sulfa allergy. Provider orders Bactrim. You should:',o:['Administer the medication as it was ordered','Give the medication along with an antihistamine','Document the allergy and then administer it','Alert the provider about the sulfa allergy first'],c:3,r:['NEVER give a drug the patient is allergic to.','Pre-medicating does not prevent anaphylaxis.','Documentation alone is not sufficient action.','Correct! Sulfa allergy + Bactrim = contraindication. Alert provider.']},

{q:'Stevens-Johnson Syndrome from a medication is classified as:',o:['A severe and potentially fatal adverse reaction','A common tolerable side effect of the drug','A normal expected therapeutic drug response','An indication for continuing the medication'],c:0,r:['Correct! SJS = severe adverse reaction with skin detachment.','SJS is potentially life-threatening, not tolerable.','This is absolutely NOT normal or expected.','SJS is a reason to STOP the drug immediately.']},

{q:'The term "indication" for metformin refers to:',o:['Treating high blood pressure effectively','Managing chronic pain and inflammation','Controlling heart rate and rhythm issues','Managing Type 2 diabetes blood sugar'],c:3,r:['ACE inhibitors/ARBs treat blood pressure.','NSAIDs manage pain and inflammation.','Beta blockers control heart rate issues.','Correct! Metformin is indicated for T2DM.']},

function rSim(el){el.innerHTML=hdr('🏥','Clinical Simulation','Full SOAP cases with suffix hints.','var(--pnk)')+`<div id="simc"></div>`;const cases=D.simCases;let ci=0;
function showCase(){if(ci>=cases.length){document.getElementById('simc').innerHTML=`<div class="cd" style="text-align:center;padding:32px"><div class="bsc">🎓</div><p>All simulations complete!</p><button class="bt bp" onclick="sw('sim')">🔄 Restart</button> <button class="bt bo" onclick="sw('perf')">📊 Stats</button></div>`;return}
const cs=cases[ci];let si=0;
function showStep(){if(si>=cs.steps.length){ci++;document.getElementById('simc').innerHTML=`<div class="cd" style="text-align:center"><h3>✅ Case Complete: ${cs.pt}</h3><p class="sub">Excellent clinical reasoning!</p><button class="bt bp bs" id="snx">Next Case →</button></div>`;document.getElementById('snx').onclick=showCase;return}
const st=cs.steps[si],sc=document.getElementById('simc');
// SHUFFLE simulation options at runtime too
const oi=sh(st.o.map((_,i)=>i)),ci2=oi.indexOf(st.c);
sc.innerHTML=`<div class="soap"><h4>📋 ${cs.pt}</h4><p><strong>CC:</strong> ${cs.cc}</p><p><strong>Vitals:</strong> ${cs.vit}</p><p><strong>Hx:</strong> ${cs.hx}</p><p><strong>Assessment:</strong> ${cs.ax}</p></div>
<div class="cd"><div style="font-family:var(--fd);font-weight:700;font-size:12px;color:var(--pur);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Step ${si+1}/${cs.steps.length}</div>
<div class="pw"><div class="pf" style="width:${si/cs.steps.length*100}%"></div></div><h3 style="font-size:15px">${st.q}</h3><div class="opts" id="sio"></div><div id="sif"></div>
<div style="margin-top:10px;display:none" id="sin"><button class="bt bp bs" id="sinb">Next Step →</button></div></div>`;
const oe=document.getElementById('sio');
oi.forEach((orig,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=st.o[orig];
b.onclick=()=>{oe.querySelectorAll('.opt').forEach((x,k)=>{x.classList.add('dn');if(k===ci2)x.classList.add('ok');if(k===i&&i!==ci2)x.classList.add('no')});
const ok=i===ci2;ok?(sOk(),aP(15),toast('✓ Correct!')):(sNo(),toast('✗ Review','e'));tr('sim',ok);
document.getElementById('sif').innerHTML=`<div class="rat ${ok?'rg':'rr'}">${st.rat}</div>`;document.getElementById('sin').style.display='block'};oe.appendChild(b)});
document.getElementById('sinb').onclick=()=>{si++;showStep()}}showStep()}showCase()}

function rPerf(){const el=document.getElementById('perf'),ta=Object.values(S.at).reduce((a,b)=>a+b,0),tc=Object.values(S.co).reduce((a,b)=>a+b,0),pct=ta?Math.round(tc/ta*100):0;let rows='',str=[],wk=[];
Object.keys(MN).forEach(id=>{const at=S.at[id]||0,co=S.co[id]||0,p=at?Math.round(co/at*100):0;if(at>=3){if(p>=80)str.push(MN[id]);else if(p<60)wk.push(MN[id])}
rows+=`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0"><span style="font-size:18px">${MI[id]}</span><div style="flex:1"><div style="font-weight:600;font-size:13px">${MN[id]}</div><div class="pw"><div class="pf" style="width:${p}%"></div></div></div><div style="font-family:var(--fm);font-weight:700;font-size:13px;color:${p>=80?'var(--grn)':p>=60?'var(--org)':'var(--red)'}">${at?p+'%':'—'}</div><div style="font-size:11px;color:var(--tx3)">${co}/${at}</div></div>`});
el.innerHTML=`${hdr('📊','Performance Dashboard','Progress across all modules.','var(--pri)')}<div class="cd" style="text-align:center;padding:32px"><div style="font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;font-weight:700">Overall Accuracy</div><div class="bsc">${pct}%</div><p style="color:var(--tx2);font-size:13px">${ta} questions · ${tc} correct · Best streak: ${S.bst}</p><div style="font-family:var(--fm);font-size:20px;font-weight:700;color:var(--pri);margin-top:6px">Score: ${S.sc}</div></div>${str.length?`<div class="cd"><h3 style="color:var(--grn)">💪 Strengths</h3><div style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0">${str.map(s=>`<span class="bg bg-g">${s}</span>`).join('')}</div></div>`:''}${wk.length?`<div class="cd"><h3 style="color:var(--red)">🎯 Focus Areas</h3><div style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0">${wk.map(s=>`<span class="bg bg-r">${s}</span>`).join('')}</div></div>`:''}
<div class="cd"><h3>Module Breakdown</h3><div style="margin-top:10px">${rows}</div></div>${ta===0?'<div class="cd"><p style="text-align:center;color:var(--tx3)">Start any module to track stats!</p></div>':''}`}

function rHome(){const el=document.getElementById('home');el.innerHTML=`<div class="wh"><h1>Master <span class="g">Pharmacology</span><br>for the NHA CCMA</h1><p>Every card has a built-in concept check. Answers are shuffled every time — no gaming the position! Suffix patterns woven throughout.</p><button class="bt bp" onclick="sw('m1')">Start with Suffixes →</button></div><div class="mg" id="hg"></div>`;const g=document.getElementById('hg');
Object.keys(MN).forEach(id=>{const at=S.at[id]||0,co=S.co[id]||0,p=at?Math.round(co/at*100):0;g.innerHTML+=`<div class="mc" onclick="sw('${id}')"><div style="font-size:24px;margin-bottom:6px">${MI[id]}</div><div style="font-weight:700;font-size:13px;margin-bottom:2px">${MN[id]}</div><div style="font-size:11px;color:var(--tx3)">${at?p+'% · '+at+' Q':'Not started'}</div>${at?`<div class="pw"><div class="pf" style="width:${p}%"></div></div>`:''}</div>`})}
rHome();uN();
</script>
